name: docs-test

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs-test.yml"
      - ".htmltest.yml"
  push:
    branches: ["master"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
  workflow_dispatch:

jobs:
  docs-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material mkdocs-static-i18n

      - name: Check nav completeness
        run: |
          missing=0
          while IFS= read -r -d '' f; do
            rel="${f#docs/}"
            if ! grep -qF "$rel" mkdocs.yml; then
              echo "NOT IN NAV: $rel"
              missing=$((missing + 1))
            fi
          done < <(find docs -maxdepth 3 -name "*.md" -not -path "*/ja/*" -print0)
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing file(s) in docs/ are not registered in mkdocs.yml nav"
            exit 1
          fi
          echo "Nav completeness OK"

      - name: Build docs
        run: mkdocs build --strict

      - name: Check internal links
        uses: wjdp/htmltest-action@master
        with:
          path: site/
          config: .htmltest.yml
