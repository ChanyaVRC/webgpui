name: test-ci

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  rust-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Rustfmt check
        run: cargo fmt --all -- --check

      - name: Cargo check (workspace)
        run: cargo check --workspace

      - name: Cargo check (filters feature)
        run: cargo check -p webgpui-render-graph -p webgpui-render-wgpu -p webgpui-app --features filters

      - name: Cargo test (workspace)
        run: cargo test --workspace --all-targets

      - name: Cargo test (filters feature)
        run: cargo test -p webgpui-render-graph -p webgpui-render-wgpu -p webgpui-app --features filters

  test-gpu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Install software Vulkan (lavapipe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1

      - name: Cargo test (webgpui-render-wgpu, --features test-gpu)
        run: cargo test -p webgpui-render-wgpu --features test-gpu

      - name: Cargo test (webgpui-render-wgpu, --features test-gpu,filters)
        run: cargo test -p webgpui-render-wgpu --features test-gpu,filters
