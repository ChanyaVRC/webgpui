site_name: webgpui Docs
site_description: webgpui design and requirements documentation
site_url: https://ChanyaVRC.github.io/webgpui/
repo_url: https://github.com/ChanyaVRC/webgpui
repo_name: ChanyaVRC/webgpui

theme:
  name: material
  language: en

extra:
  alternate:
    - name: English
      link: /webgpui/
      lang: en
    - name: 日本語
      link: /webgpui/ja/
      lang: ja

nav:
  - Getting Started:
      - Home: index.md
      - Design Philosophy: design-philosophy.md
      - Contributing Guide: contributing.md
      - Glossary: glossary.md
  - Architecture:
      - Requirements Summary: requirements-summary.md
      - Detailed Requirements: requirements.md
      - Workspace Architecture: workspace-architecture.md
      - Crate Dependencies: crate-dependencies.md
      - Architecture Decision Policy: architecture-decisions.md
      - Semver Policy: semver-policy.md
      - Roadmap: roadmap.md
  - Rendering & Performance:
      - Rendering Performance Plan: rendering-performance-plan.md
      - Replacement Strategy: replacement-strategy.md
      - API Mapping: api-mapping.md
      - API Swapping Quality Plan: api-swapping-quality-plan.md
  - Backends:
      - CUDA Backend Support: cuda-backend.md
      - Dynamic Backend Switching: dynamic-backend-switching.md
  - CI & Quality:
      - CI Gates Guide: ci-gates.md
      - Metrics Format: metrics-format.md
      - M4 Migration Metrics: m4-metrics.md
      - Docs Coverage Review: docs-coverage-review.md
  - Reference:
      - Documentation Map: documentation-map.md
      - GitHub Pages Guide: github-pages.md

not_in_nav: |
  ja/*.md

markdown_extensions:
  - tables
  - toc:
      permalink: true

plugins:
  - search
