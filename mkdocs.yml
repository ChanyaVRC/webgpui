site_name: webgpui Docs
site_description: webgpui design and requirements documentation
site_url: https://ChanyaVRC.github.io/webgpui/
repo_url: https://github.com/ChanyaVRC/webgpui
repo_name: ChanyaVRC/webgpui

theme:
  name: material
  language: en

extra:
  alternate:
    - name: English
      link: /webgpui/
      lang: en
    - name: 日本語
      link: /webgpui/ja/
      lang: ja

nav:
  - Getting Started:
      - Home: index.md
      - Design Philosophy: getting-started/design-philosophy.md
      - Contributing Guide: getting-started/contributing.md
      - Glossary: getting-started/glossary.md
  - Architecture:
      - Requirements Summary: architecture/requirements-summary.md
      - Detailed Requirements: architecture/requirements.md
      - Workspace Architecture: architecture/workspace-architecture.md
      - Crate Dependencies: architecture/crate-dependencies.md
      - Architecture Decision Policy: architecture/architecture-decisions.md
      - Semver Policy: architecture/semver-policy.md
      - Roadmap: architecture/roadmap.md
  - Rendering & Performance:
      - Rendering Performance Plan: rendering/rendering-performance-plan.md
      - Replacement Strategy: rendering/replacement-strategy.md
      - API Mapping: rendering/api-mapping.md
      - API Swapping Quality Plan: rendering/api-swapping-quality-plan.md
  - Backends:
      - CUDA Backend Support: backends/cuda-backend.md
      - Dynamic Backend Switching: backends/dynamic-backend-switching.md
  - CI & Quality:
      - CI Gates Guide: quality/ci-gates.md
      - Metrics Format: quality/metrics-format.md
      - M4 Migration Metrics: quality/m4-metrics.md
      - Docs Coverage Review: quality/docs-coverage-review.md
  - Reference:
      - Documentation Map: reference/documentation-map.md
      - GitHub Pages Guide: reference/github-pages.md
      - API Reference: reference/api-reference.md

markdown_extensions:
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            Getting Started: はじめに
            Home: ホーム
            Design Philosophy: 設計思想
            Contributing Guide: 開発ガイド
            Glossary: 用語集
            Architecture: アーキテクチャ
            Requirements Summary: 要件サマリー
            Detailed Requirements: 要件定義（詳細）
            Workspace Architecture: 構成案（crate分割）
            Crate Dependencies: クレート依存関係マップ
            Architecture Decision Policy: アーキテクチャ意思決定ログ方針
            Semver Policy: セマンティックバージョニングポリシー
            Roadmap: ロードマップ
            Rendering & Performance: レンダリング & パフォーマンス
            Rendering Performance Plan: レンダリング高速化計画
            Replacement Strategy: 代替戦略
            API Mapping: APIマッピング
            API Swapping Quality Plan: APIスワップ品質保証
            Backends: バックエンド
            CUDA Backend Support: CUDAバックエンド対応
            Dynamic Backend Switching: GPU バックエンド動的切り替え
            CI & Quality: CI & 品質
            CI Gates Guide: CIゲート運用
            Metrics Format: メトリクス仕様
            M4 Migration Metrics: M4 移行妥当性メトリクス
            Docs Coverage Review: docs追加検討結果
            Reference: リファレンス
            Documentation Map: ドキュメントマップ
            GitHub Pages Guide: GitHub Pages 公開手順
            API Reference: API リファレンス
